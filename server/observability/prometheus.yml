global:
  scrape_interval: 15s

scrape_configs:
  # Add your services here once /metrics endpoints exist.
  # For now this provides a working Prometheus + Grafana baseline.
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  # RabbitMQ management exposes metrics via a plugin; if you enable it later,
  # add a scrape job here (or use rabbitmq_exporter).

  # MongoDB exporter can be added later similarly.

