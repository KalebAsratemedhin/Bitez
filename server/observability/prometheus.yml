global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Bitez Node services expose GET /metrics (prom-client defaults).
  # Use with the main stack: `docker compose --profile metrics up -d` from `server/`
  # so Prometheus joins the same network as auth, order, etc.
  - job_name: bitez-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - auth:3001
          - restaurant:3002
          - order:3003
          - delivery:3004
          - notification:3005
          - dashboard:3006
