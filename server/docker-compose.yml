services:
  mongo:
    image: mongo:6
    command: ["--quiet"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped
    # ping can turn green before AMQP listeners are up; port check = "I am done accepting clients"
    healthcheck:
      test: rabbitmq-diagnostics -q check_port_connectivity
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 40s

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      AUTH_SERVICE_URL: http://auth:3001
      RESTAURANT_SERVICE_URL: http://restaurant:3002
      ORDER_SERVICE_URL: http://order:3003
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
    depends_on:
      - auth
      - restaurant
      - order
    restart: unless-stopped

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    environment:
      PORT: 3001
      MONGODB_URI: mongodb://mongo:27017/bitez_auth
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-bitez-internal-dev}
    depends_on:
      mongo:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  restaurant:
    build:
      context: .
      dockerfile: services/restaurant/Dockerfile
    environment:
      PORT: 3002
      MONGODB_URI: mongodb://mongo:27017/bitez_restaurant
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-bitez-internal-dev}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    depends_on:
      mongo:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  order:
    build:
      context: .
      dockerfile: services/order/Dockerfile
    environment:
      PORT: 3003
      MONGODB_URI: mongodb://mongo:27017/bitez_order
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
      AUTH_SERVICE_URL: http://auth:3001
      RESTAURANT_SERVICE_URL: http://restaurant:3002
      CHAPA_AUTH: ${CHAPA_AUTH:-}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-bitez-internal-dev}
      SERVER_URL: ${SERVER_URL:-http://localhost:8080}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
    depends_on:
      mongo:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      auth:
        condition: service_started
      restaurant:
        condition: service_started
    restart: unless-stopped

  loki:
    image: grafana/loki:3.2.1
    ports:
      - "${LOKI_PORT:-3100}:3100"
    command: ["-config.file=/etc/loki/config.yml", "-log.level=warn"]
    volumes:
      - ./observability/loki-config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.2.1
    command: ["-config.file=/etc/promtail/config.yml", "-log.level=warn"]
    volumes:
      - ./observability/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "${GRAFANA_PORT:-3007}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_LOG_LEVEL: warn
      GF_LOG_FILTERS: "alerting.notifier:error alerting.notification.response:error tsdb.loki:error"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  mongo_data:
  loki_data:
  grafana_data: